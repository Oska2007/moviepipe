{% extends "base.html" %} {% block body %}
<h2>Login</h2>
{% if error %}
<p class="err">{{error}}</p>
{% endif %}
<form method="post" action="/login">
  <input name="username" placeholder="user" autofocus />
  <input name="password" type="password" placeholder="password" />
  <button>Sign in</button>
</form>
{% endblock %}
