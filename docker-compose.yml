services:
  app:
    build: .
    container_name: mpe-app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - ./temp:/app/temp
    networks:
      - mpe-net
    expose:
      - "8000"

  caddy:
    image: caddy:2.8-alpine
    container_name: mpe-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - mpe-net

networks:
  mpe-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config: