version: '3.8'
services:
  aria2:
    image: hurlenko/aria2-ariang
    ports:
      - "8080:8080" # AriaNg Web UI
      - "6800:6800" # Aria2 RPC
    volumes:
      - ./downloads:/aria2/data  # Aria2 බාගන්න දේවල් VPS එකේ downloads ෆෝල්ඩරයට එනවා
      - ./aria2-config:/config
    restart: always

  redis:
    image: redis:alpine
    restart: always

  worker:
    build: ./worker
    volumes:
      - ./downloads:/downloads # Worker එකට ඒ ෆයිල්ස් පේනවා
    depends_on:
      - redis
      - aria2
    environment:
      - R2_ACCESS_KEY=${R2_ACCESS_KEY}
      - R2_SECRET_KEY=${R2_SECRET_KEY}
      - R2_BUCKET=${R2_BUCKET}
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    # Celery එකයි Watcher එකයි දෙකම එකපාර දුවන විදිය: (--concurrency=1 දැම්මා RAM එක ඉතිරි කරගන්න)
    command: sh -c "celery -A main worker --loglevel=info --concurrency=1 & python -u watcher.py"
    restart: always