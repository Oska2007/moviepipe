version: '3.8'
services:
  aria2:
    image: hurlenko/aria2-ariang
    ports:
      - "8080:8080" # AriaNg Web UI
      - "6800:6800" # Aria2 RPC
    volumes:
      - ./downloads:/downloads
      - ./aria2-config:/config
    restart: always

  redis:
    image: redis:alpine
    restart: always

  worker:
    build: ./worker
    volumes:
      - ./downloads:/downloads
      - ./output:/output
    depends_on:
      - redis
      - aria2
    environment:
      - R2_ACCESS_KEY=your_r2_access_key
      - R2_SECRET_KEY=your_r2_secret_key
      - R2_BUCKET=your_bucket_name
      - TELEGRAM_TOKEN=your_bot_token
      - TELEGRAM_CHAT_ID=your_channel_id
    restart: always