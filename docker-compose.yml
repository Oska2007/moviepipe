version: '3.8'
services:
  aria2:
    image: hurlenko/aria2-ariang
    ports:
      - "8080:8080" # AriaNg Web UI
      - "6800:6800" # Aria2 RPC
    volumes:
      - ./downloads:/downloads
      - ./aria2-config:/config
    restart: always

  redis:
    image: redis:alpine
    restart: always

  # මෙතනින් පහළට තියෙන කොටස හරියටම redis එකට සමානව (Space 2ක් දීලා) තියෙන්න ඕනේ
  worker:
    build: ./worker
    volumes:
      - ./downloads:/downloads
      - ./output:/output
    depends_on:
      - redis
      - aria2
    environment:
      - R2_ACCESS_KEY=${R2_ACCESS_KEY}
      - R2_SECRET_KEY=${R2_SECRET_KEY}
      - R2_BUCKET=${R2_BUCKET}
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    command: sh -c "celery -A main worker --loglevel=info & python watcher.py"
    restart: always